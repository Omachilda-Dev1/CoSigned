<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none" role="img" aria-label="CoSigned wordmark">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DFFD2"/>
      <stop offset="45%" stop-color="#4DFFD2"/>
      <stop offset="46%" stop-color="#C8FF4D"/>
      <stop offset="100%" stop-color="#C8FF4D"/>
    </linearGradient>
  </defs>

  <!-- "Co" in teal, "Signed" in yellow-green — matching the wordmark variation -->
  <text x="0" y="42" font-family="'Syne', 'Arial Black', sans-serif" font-weight="700" font-size="42" fill="#4DFFD2">Co</text>
  <text x="58" y="42" font-family="'Syne', 'Arial Black', sans-serif" font-weight="700" font-size="42" fill="#C8FF4D">Signed</text>
</svg>
